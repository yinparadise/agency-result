<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Recruitment Result Portal</title>
<style>
body{font-family:Arial;background:#f5f5f5}
.box{max-width:600px;margin:50px auto;background:#fff;padding:25px;border-radius:8px}
input{width:100%;padding:10px;margin:10px 0}
button{padding:10px 20px}
#result{margin-top:20px}
</style>
</head>
<body>
<div class="box">
<h2>Yin Paradise</h2>
<p>Please Enter your Phone Number to view the Result.</p>

<input type="password" id="password" placeholder="Enter Password">
<button onclick="checkResult()">View Result</button>

<div id="result"></div>
</div>

<script>
// Example passed candidates
const passedCandidates = {
  "070243373": {name:"oudom", position:"Network Engineer"},
  "HR2026B2": {name:"Candidate B", position:"Network Engineer"},
  "HR2026C3": {name:"Candidate C", position:"System Administrator"}
};

function checkResult(){
    const pwd = document.getElementById("password").value.trim();

    if(passedCandidates[pwd]){
        const c = passedCandidates[pwd];
        document.getElementById("result").innerHTML =
        "<h3>Congratulations!</h3>" +
        "<p><b>Name:</b> " + c.name + "</p>" +
        "<p><b>Result:</b> PASSED</p>" +
        "<p><b>Position:</b> " + c.position + "</p>";
    } else {
        document.getElementById("result").innerHTML =
        "<p><b>Sorry, You have no result, It means you are failed.</b></p>";
    }
}
</script>
</body>
</html>
